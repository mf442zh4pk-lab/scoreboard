<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Mack's Scoreboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Hanken+Grotesk:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#e8ecf1; --surface:#f7f9fb; --ink:#1a2330; --mute:#5c6b7d; --line:#ccd5df; --soft:#dfe6ed;
  --accent:#4a6785; --accent-ink:#ffffff; --live:#d1495b; --live-ink:#ffffff; --pin:#7459c4;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --ink:#e5eaf1; --mute:#8d9bae; --line:#2a3443; --soft:#1f2732;
  --accent:#8fb0d6; --accent-ink:#0b1622; --live:#ff7d8c; --live-ink:#2a0a0f; --pin:#c4b2f5; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-block:22px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:14px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,8vw,58px);line-height:.92;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.stamp{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.fresh{background:var(--accent)} .dot.stale{background:var(--pin)}
.rbtn{font:700 12px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:9px 13px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;margin-left:6px}
.rbtn:hover{background:var(--accent);color:var(--accent-ink)}
.rbtn:disabled{opacity:.6;cursor:default;background:transparent;color:var(--mute);border-color:var(--line)}
.rmsg{margin:-4px 0 12px;font-size:13px;color:var(--mute)}
.railwrap{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin-bottom:14px;border-bottom:1px solid var(--line)}
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tab{flex:none;font:700 12.5px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:10px 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tab:hover{border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab .n{opacity:.7;margin-left:6px;font-variant-numeric:tabular-nums}
section.grp{margin-bottom:28px}
h2{font:800 19px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:10px;color:var(--mute)}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
h2.live{color:var(--live)}
h2 .pulse{width:9px;height:9px;border-radius:50%;background:var(--live);animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
.lg{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,255px),1fr));gap:10px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 10px;min-width:0;display:flex;flex-direction:column}
.card.pinned{border-color:var(--pin)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);margin-bottom:8px;min-height:20px}
.pill{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--mute);white-space:nowrap}
.pill.live{background:var(--live);color:var(--live-ink)}
.pill.up{background:transparent;padding-left:0;font-size:12px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.pin{color:var(--pin)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 0}
.row+.row{border-top:1px solid var(--soft)}
.row .tm{min-width:0;display:flex;align-items:baseline;gap:8px}
.ab{font:800 22px/1 var(--f-display);letter-spacing:.03em;min-width:3.1ch}
.nm{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.row.lose .ab,.row.lose .sc{color:var(--mute);font-weight:600}
.big .row{padding:8px 0}
.big .ab{font-size:34px}
.big .nm{font-size:15px;color:var(--ink)}
.big .sc{font-size:50px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 18px;color:var(--mute)}
.empty b{color:var(--ink);display:block;margin-bottom:4px;font-size:16px}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);max-width:72ch}
footer p{margin:0 0 6px}
.recaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.recap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.recap.played{border-color:var(--pin)}
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.rh h3{margin:0;font:800 22px/1.05 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.res{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);flex:none}
.res.win{color:var(--accent)}
.rl{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums;margin-bottom:8px}
.rb{margin:0;max-width:62ch}
.card.click{cursor:pointer;transition:border-color .12s}
.card.click:hover{border-color:var(--accent)}
.back{font:700 12px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;margin-bottom:14px}
.back:hover{border-color:var(--accent)}
.dhead{max-width:520px;margin-bottom:22px}
.blk{margin-bottom:24px}
.blk h3{margin:0 0 8px;font:800 19px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 12px;text-align:right;white-space:nowrap}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line);font-weight:700}
td{border-bottom:1px solid var(--soft)}
tbody tr:last-child td{border-bottom:0}
th.l,td.l{text-align:left}
td.l{font-weight:700}
.plays{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.play{display:flex;gap:12px;padding:9px 12px;border-bottom:1px solid var(--soft);font-size:14px}
.play:last-child{border-bottom:0}
.play .pt{flex:none;width:78px;color:var(--mute);font-size:12px;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums;padding-top:1px}
.play .px{min-width:0}
.tnote{margin:6px 2px 0;font-size:12px;color:var(--mute)}
.sum p{margin:0;max-width:68ch;font-size:15px;line-height:1.55}
</style>
</head><body>
<div class="wrap">
<header>
<h1>Mack's Scoreboard</h1>
<div class="stamp"><span class="dot" id="dot"></span><span id="stamp">Loading scores</span><button class="rbtn" id="refresh" type="button">Refresh</button></div>
</header>
<div class="railwrap"><div class="rail" id="rail" role="tablist" aria-label="Leagues"></div></div>
<div id="out"></div>
<footer><p id="about"></p><p id="foot"></p></footer>
</div>
<script>
(function(){
var BASE="https://site.api.espn.com/apis/site/v2/sports";
var LG=[["nfl","NFL","football/nfl"],["nba","NBA","basketball/nba"],["nhl","NHL","hockey/nhl"],["mlb","MLB","baseball/mlb"],["ncaafb","College FB","football/college-football"],["epl","Premier League","soccer/eng.1"],["ucl","Champions League","soccer/uefa.champions"]];
var PINS=["New England Patriots","Boston Celtics","Boston Bruins","Boston Red Sox","Brisbane Lions"];
var DAY=86400000;
var data={}, tab="pinned", ready=false, view=null, lastUpdated=0, loading=false, failed=[];
var $=function(id){return document.getElementById(id)};
try{var t0=localStorage.getItem("sb-tab"); if(t0) tab=t0;}catch(e){}

function getJson(url){
  var ctl=new AbortController(), timer=setTimeout(function(){ctl.abort()},8000);
  return fetch(url,{signal:ctl.signal}).then(function(r){
    clearTimeout(timer); if(!r.ok) throw new Error("HTTP "+r.status); return r.json();
  },function(e){clearTimeout(timer); throw e});
}
function ymd(d){return d.toISOString().slice(0,10).replace(/-/g,"")}
function etDate(d){return new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).format(d)}
function stateOf(ev){var s=ev.status&&ev.status.type&&ev.status.type.state; return s==="in"?"inprogress":s==="post"?"closed":"scheduled"}
function normalize(ev,lk){
  var comp=(ev.competitions&&ev.competitions[0])||{}, cs=comp.competitors||[];
  var home=cs.filter(function(c){return c.homeAway==="home"})[0], away=cs.filter(function(c){return c.homeAway==="away"})[0];
  if(!home||!away) return null;
  var st=stateOf(ev);
  function side(c){var n=(st==="scheduled"||c.score==null||c.score==="")?null:Number(c.score); return [c.team.displayName,c.team.abbreviation,n]}
  var g={id:ev.id,lk:lk,s:st,t:ev.date,h:side(home),a:side(away)};
  if(st==="inprogress") g.c=(ev.status.type&&ev.status.type.shortDetail)||"";
  var note=comp.notes&&comp.notes[0]&&comp.notes[0].headline; if(note) g.n=note;
  return g;
}
function isPinnedG(g){return PINS.indexOf(g.h[0])>=0||PINS.indexOf(g.a[0])>=0}
function trim(games){
  var pinned=games.filter(isPinnedG), rest=games.filter(function(g){return !isPinnedG(g)});
  var live=rest.filter(function(g){return g.s==="inprogress"});
  var fin=rest.filter(function(g){return g.s==="closed"}).sort(function(a,b){return new Date(b.t)-new Date(a.t)}).slice(0,8);
  var up=rest.filter(function(g){return g.s==="scheduled"}).sort(function(a,b){return new Date(a.t)-new Date(b.t)}).slice(0,8);
  var seen={}; return pinned.concat(live,fin,up).filter(function(g){if(seen[g.id]) return false; seen[g.id]=1; return true});
}
function nextOf(all,name){
  var n=all.filter(function(x){return x.s==="scheduled"&&(x.h[0]===name||x.a[0]===name)}).sort(function(a,b){return new Date(a.t)-new Date(b.t)})[0];
  return n?" Next up: "+(n.h[0]===name?"vs "+n.a[0]:"at "+n.h[0])+".":"";
}
function buildYesterday(all,now){
  var yd=new Date(now.getTime()-DAY), yDate=etDate(yd);
  var label=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"long",month:"long",day:"numeric"}).format(yd);
  var teams=PINS.map(function(name){
    if(name==="Brisbane Lions") return {name:name,played:false,body:"No AFL feed is connected, so there is nothing to show for the Lions."};
    var g=all.filter(function(x){return x.s==="closed"&&etDate(new Date(x.t))===yDate&&(x.h[0]===name||x.a[0]===name)})[0];
    if(!g) return {name:name,played:false,body:"No game yesterday."+nextOf(all,name)};
    var home=g.h[0]===name, mine=home?g.h:g.a, opp=home?g.a:g.h;
    var result=mine[2]>opp[2]?"W":mine[2]<opp[2]?"L":"T";
    var body=(result==="W"?"Won ":result==="L"?"Lost ":"Tied ")+Math.max(mine[2],opp[2])+"-"+Math.min(mine[2],opp[2])+(home?" at home against ":" on the road at ")+opp[0]+"."+nextOf(all,name);
    var hi=mine[2]>=opp[2]?[mine,opp]:[opp,mine];
    return {name:name,played:true,result:result,line:hi[0][0]+" "+hi[0][2]+", "+hi[1][0]+" "+hi[1][2],body:body};
  });
  return {date:label,teams:teams};
}
function fetchScores(){
  var now=new Date(), range=ymd(new Date(now.getTime()-3*DAY))+"-"+ymd(new Date(now.getTime()+7*DAY));
  return Promise.all(LG.map(function(l){
    return getJson(BASE+"/"+l[2]+"/scoreboard?dates="+range+"&limit=300").then(function(j){
      return (j.events||[]).map(function(e){return normalize(e,l[0])}).filter(Boolean);
    }).then(function(v){return {ok:true,v:v}},function(){return {ok:false,v:[]}});
  })).then(function(rs){
    var scores={}, all=[], bad=[];
    rs.forEach(function(r,i){ if(r.ok){all=all.concat(r.v); scores[LG[i][0]]=trim(r.v)} else {scores[LG[i][0]]=[]; bad.push(LG[i][1])} });
    return {updated:now.toISOString(),scores:scores,yesterday:buildYesterday(all,now),failed:bad};
  });
}
function cl(v){return v==null||v===""?"–":String(v)}
function fetchGame(x){
  var l=LG.filter(function(q){return q[0]===x.lk})[0];
  return getJson(BASE+"/"+l[2]+"/summary?event="+encodeURIComponent(x.g.id)).then(function(d){
    var box=d.boxscore||{}, comp=d.header&&d.header.competitions&&d.header.competitions[0], out={periods:null,tables:[],plays:[],preview:null};
    if(comp){
      var cs=comp.competitors||[], away=cs.filter(function(c){return c.homeAway==="away"})[0], home=cs.filter(function(c){return c.homeAway==="home"})[0];
      if(away&&home){
        var la=away.linescores||[], lh=home.linescores||[], n=Math.max(la.length,lh.length);
        if(n){
          var labels=[]; for(var i=0;i<n;i++) labels.push(String(i+1));
          var val=function(ls,i){return ls[i]?Number(ls[i].displayValue!=null?ls[i].displayValue:ls[i].value):null};
          var row=function(c,ls){return [c.team.abbreviation].concat(labels.map(function(_,i){return val(ls,i)}))};
          out.periods={labels:labels,rows:[row(away,la),row(home,lh)]};
        }
        var rec=function(c){var r=c.record&&(c.record.filter(function(z){return z.type==="total"})[0]||c.record[0]); return r&&(r.summary||r.displayValue)?" ("+(r.summary||r.displayValue)+")":""};
        var s=away.team.displayName+rec(away)+" visit "+home.team.displayName+rec(home)+".";
        var pc=d.pickcenter&&d.pickcenter[0];
        if(pc&&pc.details) s+=" Line: "+pc.details+(pc.overUnder?", over/under "+pc.overUnder:"")+".";
        out.preview=s;
      }
    }
    var tm=box.teams||[];
    if(tm.length>=2){
      var mp=function(t){var m={}; (t.statistics||[]).forEach(function(z){m[z.label||z.name]=z.displayValue}); return m};
      var ma=mp(tm[0]), mh=mp(tm[1]), keys=Object.keys(ma).concat(Object.keys(mh).filter(function(k){return !(k in ma)}));
      if(keys.length) out.tables.push({title:"Team stats",cols:["",tm[0].team.abbreviation,tm[1].team.abbreviation],rows:keys.map(function(k){return [k,cl(ma[k]),cl(mh[k])]})});
    }
    (box.players||[]).forEach(function(tp){
      var ab=tp.team&&tp.team.abbreviation;
      (tp.statistics||[]).forEach(function(cat){
        var labs=cat.labels||cat.keys||[], ath=cat.athletes||[];
        if(!labs.length||!ath.length) return;
        var ti=ab+" "+(cat.displayName||cat.name||"players");
        out.tables.push({title:ti.charAt(0).toUpperCase()+ti.slice(1),cols:["Player"].concat(labs),rows:ath.map(function(a){return [(a.athlete&&a.athlete.displayName)||"–"].concat((a.stats||[]).map(cl))})});
      });
    });
    var src=(d.plays&&d.plays.length?d.plays:d.scoringPlays)||[];
    out.plays=src.slice(-25).reverse().map(function(p){
      var per=p.period&&p.period.number!=null?(p.period.displayValue||p.period.number):"", ck=p.clock&&p.clock.displayValue?p.clock.displayValue:"";
      return {t:[per,ck].filter(Boolean).join(" "),x:p.text||p.shortText||""};
    }).filter(function(p){return p.x});
    return out;
  });
}
function isPinned(g){return isPinnedG(g)}
function allGames(){
  var out=[];
  LG.forEach(function(l){var d=data[l[0]]; if(d&&d.games) d.games.forEach(function(g){out.push({g:g,lk:l[0],ll:l[1]})});});
  return out;
}
function kind(s){return s==="inprogress"?"live":(s==="closed"?"final":"up")}
function when(iso){var d=new Date(iso); if(isNaN(d)) return ""; return d.toLocaleString(undefined,{weekday:"short",hour:"numeric",minute:"2-digit"})}
function el(tag,cls,txt){var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e}

function card(x){
  var g=x.g,k=kind(g.s),c=el("div","card"+(isPinned(g)?" pinned":""));
  var top=el("div","top");
  top.appendChild(el("span","pill "+k,k==="live"?"Live · "+(g.c||""):(k==="final"?"Final":when(g.t))));
  top.appendChild(isPinned(g)?el("span","tag pin","Following · "+x.ll):el("span","tag",x.ll+(g.n?" · "+g.n:"")));
  c.appendChild(top);
  var hs=g.h[2],as=g.a[2],has=(k!=="up")&&hs!=null&&as!=null;
  [[g.a,as,hs],[g.h,hs,as]].forEach(function(r){
    var row=el("div","row"+(has&&r[1]<r[2]&&k==="final"?" lose":""));
    var tm=el("div","tm"); tm.appendChild(el("span","ab",r[0][1])); tm.appendChild(el("span","nm",r[0][0]));
    row.appendChild(tm); row.appendChild(el("span","sc",has?String(r[1]):"–"));
    c.appendChild(row);
  });
  return c;
}
function group(title,cls,items,big){
  if(!items.length) return null;
  var s=el("section","grp"), h=el("h2",cls||"");
  if(cls==="live") h.appendChild(el("span","pulse"));
  h.appendChild(document.createTextNode(title)); s.appendChild(h);
  var gr=el("div","grid"+(big?" big":""));
  items.forEach(function(x){
    var c=card(x); c.classList.add("click"); c.tabIndex=0; c.setAttribute("role","button");
    c.setAttribute("aria-label","Open box score: "+x.g.a[0]+" at "+x.g.h[0]);
    c.onclick=function(){openGame(x)};
    c.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();openGame(x)}};
    gr.appendChild(c);
  });
  s.appendChild(gr);
  return s;
}
function renderYesterday(out){
  var y=data.yesterday;
  if(!y||!y.teams){var e=el("div","empty"); e.appendChild(el("b",null,"No recap yet")); e.appendChild(document.createTextNode("Hit Refresh to load yesterday's results.")); out.appendChild(e); return;}
  out.appendChild(el("p","lg",y.date||"Yesterday"));
  var played=y.teams.filter(function(t){return t.played});
  if(!played.length){var e3=el("div","empty"); e3.appendChild(el("b",null,"No games yesterday")); e3.appendChild(document.createTextNode("None of your teams played yesterday.")); out.appendChild(e3); return;}
  var gr=el("div","recaps");
  played.forEach(function(t){
    var a=el("article","recap played");
    var h=el("div","rh"); h.appendChild(el("h3",null,t.name)); h.appendChild(el("span","res"+(t.result==="W"?" win":""),t.result==="W"?"Won":t.result==="L"?"Lost":"Tied"));
    a.appendChild(h);
    if(t.line) a.appendChild(el("div","rl",t.line));
    a.appendChild(el("p","rb",t.body||""));
    gr.appendChild(a);
  });
  out.appendChild(gr);
}
function openGame(x){
  var key=x.lk+"_"+x.g.id; view={x:x,key:key,d:undefined};
  render(); window.scrollTo(0,0);
  fetchGame(x).then(function(d){ if(view&&view.key===key){view.d=d; render();} },
    function(){ if(view&&view.key===key){view.d=null; render();} });
}
function tbl(t){
  var box=el("section","blk"); if(t.title) box.appendChild(el("h3",null,t.title));
  var tw=el("div","tw"), tb=el("table"), hd=el("thead"), hr=el("tr");
  (t.cols||[]).forEach(function(c,i){hr.appendChild(el("th",i===0?"l":null,c))});
  hd.appendChild(hr); tb.appendChild(hd);
  var bd=el("tbody");
  (t.rows||[]).forEach(function(r){var tr=el("tr"); r.forEach(function(v,i){tr.appendChild(el("td",i===0?"l":null,v==null?"–":String(v)))}); bd.appendChild(tr)});
  tb.appendChild(bd); tw.appendChild(tb); box.appendChild(tw);
  return box;
}
function renderDetail(out){
  var x=view.x,g=x.g,d=view.d;
  var back=el("button","back","← All scores"); back.type="button"; back.onclick=function(){view=null; render(); window.scrollTo(0,0)};
  out.appendChild(back);
  var hd=el("div","dhead"); hd.appendChild(card(x)); out.appendChild(hd);
  if(d===undefined){out.appendChild(el("p","rmsg","Loading box score…")); return;}
  if(d===null){out.appendChild(el("p","rmsg","Could not load the box score right now. Try again in a moment.")); return;}
  if(d.periods&&d.periods.rows){
    var lab=d.periods.labels||[], rows=d.periods.rows.map(function(r){
      var tot=0; for(var i=1;i<r.length;i++) if(typeof r[i]==="number") tot+=r[i];
      return r.concat([tot]);
    });
    out.appendChild(tbl({title:"Score by period",cols:[""].concat(lab,["T"]),rows:rows}));
  }
  (d.tables||[]).forEach(function(t){out.appendChild(tbl(t))});
  if(d.plays&&d.plays.length){
    var pb=el("section","blk"); pb.appendChild(el("h3",null,"Recent plays"));
    var sc=el("div","plays"); sc.tabIndex=0;
    d.plays.forEach(function(p){var r=el("div","play"); r.appendChild(el("span","pt",p.t||"")); r.appendChild(el("span","px",p.x||"")); sc.appendChild(r)});
    pb.appendChild(sc); out.appendChild(pb);
  }
  var sm=el("section","blk sum"); sm.appendChild(el("h3",null,"Matchup preview"));
  sm.appendChild(el("p",null,d.preview||"A matchup preview is not available for this game.")); out.appendChild(sm);
}
function render(){
  var rail=$("rail"); rail.textContent="";
  var all=allGames(), pinned=all.filter(function(x){return isPinned(x.g)});
  var tabs=[["pinned","Following",pinned.length],["yesterday","What happened yesterday",null],["all","All",all.length]].concat(LG.map(function(l){
    return [l[0],l[1],(data[l[0]]&&data[l[0]].games||[]).length]}));
  tabs.forEach(function(t){
    var b=el("button","tab"); b.setAttribute("role","tab"); b.setAttribute("aria-selected",t[0]===tab?"true":"false");
    b.appendChild(document.createTextNode(t[1])); if(t[2]!=null) b.appendChild(el("span","n",String(t[2])));
    b.onclick=function(){tab=t[0]; view=null; try{localStorage.setItem("sb-tab",tab)}catch(e){} render()};
    rail.appendChild(b);
  });
  var out=$("out"); out.textContent="";
  if(!ready){
    var em=el("div","empty"); em.appendChild(el("b",null,"Scores will show up here")); em.appendChild(document.createTextNode("Live games, finals and what is next for your teams load in a moment. Hit Refresh if nothing appears.")); out.appendChild(em); return;
  }
  if(view){renderDetail(out); return;}
  $("about").textContent="Following: Patriots, Celtics, Bruins, Red Sox. Brisbane Lions (AFL) are on the list, but there is no AFL feed yet, so nothing shows for them.";
  if(tab==="yesterday"){renderYesterday(out); return;}
  var items=tab==="pinned"?pinned:(tab==="all"?all:all.filter(function(x){return x.lk===tab}));
  if(!items.length){var e2=el("div","empty"); e2.appendChild(el("b",null,"Nothing on right now")); e2.appendChild(document.createTextNode("No games for this view in the latest update.")); out.appendChild(e2); return;}
  var big=tab==="pinned";
  var live=items.filter(function(x){return kind(x.g.s)==="live"}),
      up=items.filter(function(x){return kind(x.g.s)==="up"}).sort(function(a,b){return new Date(a.g.t)-new Date(b.g.t)}),
      fin=items.filter(function(x){return kind(x.g.s)==="final"}).sort(function(a,b){return new Date(b.g.t)-new Date(a.g.t)});
  [group("Live now","live",live,big),group("Coming up","",up,big),group("Final","",fin,big)].forEach(function(s){if(s) out.appendChild(s)});
}
function stampTick(){
  var s=$("stamp"), d=$("dot");
  if(!lastUpdated){s.textContent=loading?"Loading scores":"No scores yet"; d.className="dot"; return;}
  var m=Math.max(0,Math.round((Date.now()-lastUpdated)/60000));
  s.textContent="Updated "+(m<1?"just now":m<60?m+" min ago":Math.round(m/60)+" hr ago");
  d.className="dot "+(m<=5?"fresh":"stale");
  $("foot").textContent=(failed.length?"Could not load: "+failed.join(", ")+". ":"")+"Scores refresh by themselves every minute while a game is live. Tap Refresh any time for the latest.";
}
function load(){
  if(loading) return;
  loading=true; var b=$("refresh"); b.disabled=true; b.textContent="Refreshing"; stampTick();
  fetchScores().then(function(j){
    var nd={}; LG.forEach(function(l){nd[l[0]]={games:j.scores[l[0]]||[]}});
    nd.yesterday=j.yesterday; data=nd; failed=j.failed||[]; ready=true; lastUpdated=Date.parse(j.updated)||Date.now();
    render();
  }).catch(function(){ $("stamp").textContent="Could not reach the score server"; $("dot").className="dot stale"; })
  .then(function(){ loading=false; b.disabled=false; b.textContent="Refresh"; stampTick(); });
}
function anyLive(){return allGames().some(function(x){return kind(x.g.s)==="live"})}
render(); stampTick(); setInterval(stampTick,30000);
$("refresh").onclick=load;
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&view){view=null; render()}});
document.addEventListener("visibilitychange",function(){ if(!document.hidden&&Date.now()-lastUpdated>60000) load(); });
setInterval(function(){ if(!document.hidden&&anyLive()) load(); },60000);
load();
function fetchScores(){
var now=new Date();
var dates=[-1,0,1,2,3].map(function(n){return etDate(new Date(now.getTime()+n*DAY)).replace(/-/g,"")});
var jobs=[];
LG.forEach(function(l,li){dates.forEach(function(d){
jobs.push({li:li,p:getJson(BASE+"/"+l[2]+"/scoreboard?dates="+d).then(function(j){return (j.events||[]).map(function(e){return normalize(e,l[0])}).filter(Boolean)},function(){return null})});
})});
return Promise.all(jobs.map(function(j){return j.p})).then(function(res){
var by=LG.map(function(){return {ok:0,games:[]}});
res.forEach(function(r,i){var o=by[jobs[i].li]; if(r){o.ok++; o.games=o.games.concat(r)}});
var scores={}, all=[], bad=[];
by.forEach(function(o,i){
if(!o.ok){bad.push(LG[i][1]); scores[LG[i][0]]=[]; return}
var seen={}; var gs=o.games.filter(function(g){if(seen[g.id]) return false; seen[g.id]=1; return true});
all=all.concat(gs); scores[LG[i][0]]=trim(gs);
});
return {updated:now.toISOString(),scores:scores,yesterday:buildYesterday(all,now),failed:bad};
});
}
var DS=document.createElement("style");
DS.textContent="details.sec{margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)} details.sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;font:800 17px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)} details.sec>summary::-webkit-details-marker{display:none} details.sec>summary::after{content:'+';font-size:22px;line-height:1;color:var(--accent)} details.sec[open]>summary::after{content:'−'} details.sec.fav>summary{color:var(--pin)} details.sec.fav{border-color:var(--pin)} details.sec>.body{padding:0 12px 12px} details.sec .tw{border:0;border-radius:0;background:transparent} details.sec .plays{border:0;background:transparent} details.sec .sum p{margin:0} .allbar{display:flex;gap:8px;margin-bottom:12px} .allbar button{font:700 12px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}";
document.head.appendChild(DS);
function sec(title,node,open,fav){
var d=el("details","sec"+(fav?" fav":"")); if(open) d.open=true;
d.appendChild(el("summary",null,title));
var b=el("div","body"); b.appendChild(node); d.appendChild(b);
return d;
}
function renderDetail(out){
var x=view.x,g=x.g,k=kind(g.s),d=view.d;
var back=el("button","back","← All scores"); back.type="button"; back.onclick=function(){view=null; render(); window.scrollTo(0,0)};
out.appendChild(back);
var hd=el("div","dhead"); hd.appendChild(card(x)); out.appendChild(hd);
if(d===undefined){out.appendChild(el("p","rmsg","Loading box score…")); return;}
if(d===null){out.appendChild(el("p","rmsg","Could not load the box score right now. Try again in a moment.")); return;}
var favAbbr=[g.a,g.h].filter(function(t){return PINS.indexOf(t[0])>=0}).map(function(t){return t[1]});
var isFav=function(t){return favAbbr.some(function(a){return (t.title||"").indexOf(a+" ")===0})};
var list=[];
var pv=el("div","sum"); pv.appendChild(el("p",null,d.preview||(g.a[0]+" visit "+g.h[0]+" "+when(g.t)+".")));
var previewSec=sec("Matchup preview",pv,k==="up",false);
if(k==="up") list.push(previewSec);
if(d.periods&&d.periods.rows){
var lab=d.periods.labels||[], rows=d.periods.rows.map(function(r){
var tot=0; for(var i=1;i<r.length;i++) if(typeof r[i]==="number") tot+=r[i];
return r.concat([tot]);
});
list.push(sec("Score by period",tbl({cols:[""].concat(lab,["T"]),rows:rows}),true,false));
}
var tabs=d.tables||[];
var teamStat=tabs.filter(function(t){return t.title==="Team stats"});
var players=tabs.filter(function(t){return t.title!=="Team stats"});
teamStat.forEach(function(t){list.push(sec(t.title,tbl({cols:t.cols,rows:t.rows}),true,false))});
var favP=players.filter(isFav), otherP=players.filter(function(t){return !isFav(t)});
favP.forEach(function(t){list.push(sec(t.title,tbl({cols:t.cols,rows:t.rows}),true,true))});
otherP.forEach(function(t){list.push(sec(t.title,tbl({cols:t.cols,rows:t.rows}),!favP.length&&k!=="up",false))});
if(d.plays&&d.plays.length){
var sc=el("div","plays"); sc.tabIndex=0;
d.plays.forEach(function(p){var r=el("div","play"); r.appendChild(el("span","pt",p.t||"")); r.appendChild(el("span","px",p.x||"")); sc.appendChild(r)});
list.push(sec("Recent plays",sc,k==="live",false));
}
if(k!=="up") list.push(previewSec);
var bar=el("div","allbar");
var b1=el("button",null,"Expand all"), b2=el("button",null,"Collapse all");
b1.type="button"; b2.type="button";
b1.onclick=function(){list.forEach(function(s){s.open=true})};
b2.onclick=function(){list.forEach(function(s){s.open=false})};
bar.appendChild(b1); bar.appendChild(b2);
out.appendChild(bar);
list.forEach(function(s){out.appendChild(s)});
}
})();
</script>
