<style>
/* Splash: paints before anything else loads, plays one second of the M doing sports, then hands off to the app. */
#sp{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#121722;transition:opacity .28s ease,visibility .28s;-webkit-user-select:none;user-select:none}
#sp.off{opacity:0;visibility:hidden;pointer-events:none}
#sp .m{width:92px;height:92px;filter:drop-shadow(0 14px 18px rgba(45,58,85,.55));animation:spm 1s cubic-bezier(.3,.7,.3,1) both;transform-origin:50% 100%}
#sp .sh{width:70px;height:10px;border-radius:50%;background:rgba(0,0,0,.45);margin-top:-18px;animation:spsh 1s cubic-bezier(.3,.7,.3,1) both}
#sp{perspective:700px}#sp .w{position:absolute;left:50%;top:50%;margin:-62px 0 0 -15px;font-size:30px;opacity:0;animation:spw 1s linear both;will-change:transform,opacity}
#sp .w.b{animation-delay:0s}#sp .w.f{animation-delay:.25s}#sp .w.h{animation-delay:.5s}#sp .w.s{animation-delay:.75s}
#sp .t{font:700 12px/1 system-ui,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#9b8cd9;animation:spt .6s .2s ease both}
@keyframes spm{0%{transform:translateY(-40px) scale(1,1)}12%{transform:translateY(0) scale(1.12,.86)}22%{transform:translateY(-26px) scale(.96,1.04)}30%{transform:translateY(0) scale(1.08,.9) rotate(0)}42%{transform:translateY(-14px) rotateY(180deg) rotate(-10deg)}54%{transform:translateY(-8px) rotateY(360deg) rotate(6deg)}62%{transform:translate(-46px,0) rotate(-14deg)}74%{transform:translate(42px,0) rotate(12deg)}84%{transform:translate(0,-6px) rotate(0) scale(1.1)}100%{transform:translate(0,0) scale(1)}}
@keyframes spsh{0%{transform:scale(.6);opacity:.3}12%{transform:scale(1.1);opacity:1}22%{transform:scale(.75);opacity:.5}30%{transform:scale(1.05);opacity:1}54%{transform:scale(.7);opacity:.5}62%{transform:translateX(-46px) scale(.9)}74%{transform:translateX(42px) scale(.9)}100%{transform:scale(1);opacity:.9}}
@keyframes spw{0%{opacity:0;transform:translate(0,30px) scale(.4)}25%{opacity:1;transform:translate(0,-40px) scale(1)}45%{opacity:0;transform:translate(60px,-80px) scale(.6)}100%{opacity:0}}
@keyframes spt{from{opacity:0;letter-spacing:.6em}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#sp .m,#sp .sh,#sp .w,#sp .t{animation:none}#sp .w{display:none}}
</style>
</head>
