<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a5d7e">
<title>Scoreboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234a5d7e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%239b8cd9'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Hanken+Grotesk:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Scoreboard</h1>
    <div class="ctl"><span class="dot" id="dot"></span><span id="stamp" aria-live="polite">Loading scores</span><button id="refresh" type="button">Refresh</button></div>
  </header>
  <p class="about" id="about"></p>
  <nav class="rail" id="rail" role="tablist" aria-label="Views"></nav>
  <main id="out"></main>
  <p class="foot" id="foot"></p>
</div>
<noscript>This scoreboard needs JavaScript.</noscript>
<script src="config.js?v=1"></script>
<script src="espn.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
